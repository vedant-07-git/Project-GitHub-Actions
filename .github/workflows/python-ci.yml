
name: Python CI and Docker Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t python-add-app:latest .

      - name: Test Docker image
        run: docker run --rm python-add-app:latest
