name: Hello GitHub Actions

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: python --version

      - name: Check Docker
        run: docker --version

      - name: Show files
        run: ls -la

      - name: Final message
        run: echo "My first GitHub Actions workflow is working!"
